name: Build HesabYar Feature APK

on:
  push:
    branches: [ hesabyar-feature-v2 ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode and validate source
        run: |
          mkdir -p project decoded_parts
          for f in source_parts/part00a.b64 source_parts/part00b.b64 source_parts/part01.b64 source_parts/part02.b64 source_parts/part03.b64; do
            base64 -d "$f" > "decoded_parts/$(basename "$f" .b64).bin"
          done
          cat decoded_parts/part00a.bin decoded_parts/part00b.bin decoded_parts/part01.bin decoded_parts/part02.bin decoded_parts/part03.bin > hesabyar-source.zip
          unzip -t hesabyar-source.zip
          unzip -q hesabyar-source.zip -d project

      - name: Prefer official repositories in CI while keeping Myket fallback
        run: |
          cat > project/settings.gradle.kts <<'EOF'
          import org.gradle.api.initialization.resolve.RepositoriesMode

          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
                  maven { url = uri("https://maven.myket.ir") }
              }
          }

          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
                  maven { url = uri("https://maven.myket.ir") }
              }
          }

          rootProject.name = "HesabYar"
          include(":app")
          EOF

      - name: Apply Jalali redesign and new-SMS-only base
        run: |
          python redesign_override/apply_redesign.py

      - name: Apply editable SMS balance and debt history features
        run: |
          cp redesign_override/app/src/main/java/ir/hesabyar/finance/sms/SmsParser.kt project/app/src/main/java/ir/hesabyar/finance/sms/SmsParser.kt
          cp feature_override/Models.kt project/app/src/main/java/ir/hesabyar/finance/data/Models.kt
          cat feature_src/repo_00 feature_src/repo_01 > project/app/src/main/java/ir/hesabyar/finance/data/FinanceRepository.kt
          cp feature_src/FinanceViewModel.kt project/app/src/main/java/ir/hesabyar/finance/ui/FinanceViewModel.kt
          cp feature_src/SmsReceiver.kt project/app/src/main/java/ir/hesabyar/finance/sms/SmsReceiver.kt
          cp feature_src/FinanceApp.kt project/app/src/main/java/ir/hesabyar/finance/ui/FinanceApp.kt
          cat feature_src/screens_00 feature_src/screens_01 feature_src/screens_02a feature_src/screens_02b feature_src/screens_02c feature_src/screens_03 > project/app/src/main/java/ir/hesabyar/finance/ui/screens/Screens.kt
          rm -f project/app/src/main/java/ir/hesabyar/finance/sms/SmsImporter.kt
          sed -i '/android.permission.READ_SMS/d' project/app/src/main/AndroidManifest.xml
          python - <<'PY'
          from pathlib import Path
          p=Path('project/app/build.gradle.kts')
          s=p.read_text()
          import re
          s=re.sub(r'versionCode\s*=\s*\d+', 'versionCode = 4', s)
          s=re.sub(r'versionName\s*=\s*"[^"]+"', 'versionName = "1.3.0"', s)
          p.write_text(s)
          PY

      - name: Verify feature source before compile
        run: |
          grep -R -n 'fun updateTransaction' project/app/src/main/java/ir/hesabyar/finance/data/FinanceRepository.kt
          grep -R -n 'repairUnassignedSmsTransactions' project/app/src/main/java/ir/hesabyar/finance
          grep -R -n 'PersonLedgerEntry' project/app/src/main/java/ir/hesabyar/finance
          grep -R -n 'EditTransactionDialog' project/app/src/main/java/ir/hesabyar/finance
          grep -R -n 'تاریخچه' project/app/src/main/java/ir/hesabyar/finance/ui/screens/Screens.kt
          grep -R -n 'FabPosition.End' project/app/src/main/java/ir/hesabyar/finance/ui/FinanceApp.kt
          grep -R -n 'resolveSmsAccount' project/app/src/main/java/ir/hesabyar/finance/sms/SmsReceiver.kt
          grep -R -n 'AmountUnit' project/app/src/main/java/ir/hesabyar/finance/sms/SmsParser.kt
          ! grep -R -n 'android.permission.READ_SMS' project/app/src/main
          ! grep -R -n 'syncSms()' project/app/src/main
          ! grep -R -n -E '2027|۲۰۲۷' project/app/src/main

      - name: Locate and install Android SDK 36
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          SDKMANAGER=""
          for candidate in \
            "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" \
            "$SDK_ROOT/cmdline-tools/bin/sdkmanager" \
            "$SDK_ROOT/tools/bin/sdkmanager"; do
            if [ -x "$candidate" ]; then SDKMANAGER="$candidate"; break; fi
          done
          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$SDK_ROOT" -maxdepth 6 -type f -name sdkmanager -perm -111 | head -n 1)"
          fi
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
          echo "sdk.dir=$SDK_ROOT" > project/local.properties
          test -f "$SDK_ROOT/platforms/android-36/android.jar"

      - name: Build debug APK
        working-directory: project
        env:
          GRADLE_OPTS: "-Dorg.gradle.internal.http.connectionTimeout=15000 -Dorg.gradle.internal.http.socketTimeout=15000"
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Copy and verify APK
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk HesabYar-history-edit-balance.apk
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          "$SDK_ROOT/build-tools/36.0.0/apksigner" verify --verbose HesabYar-history-edit-balance.apk
          sha256sum HesabYar-history-edit-balance.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar-history-edit-balance
          path: HesabYar-history-edit-balance.apk
          if-no-files-found: error
