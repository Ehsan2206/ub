name: Build HesabYar APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Decode and validate source
        run: |
          mkdir -p project decoded_parts
          wc -c source_parts/*.b64
          sha256sum source_parts/*.b64
          for f in source_parts/part00.b64 source_parts/part01.b64 source_parts/part02.b64 source_parts/part03.b64; do
            echo "Decoding $f"
            base64 -d "$f" > "decoded_parts/$(basename "$f" .b64).bin"
          done
          cat decoded_parts/part00.bin decoded_parts/part01.bin decoded_parts/part02.bin decoded_parts/part03.bin > hesabyar-source.zip
          unzip -t hesabyar-source.zip
          unzip -q hesabyar-source.zip -d project

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Build debug APK
        working-directory: project
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Copy APK
        run: cp project/app/build/outputs/apk/debug/app-debug.apk HesabYar2027-original.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HesabYar2027-original
          path: HesabYar2027-original.apk
          if-no-files-found: error
